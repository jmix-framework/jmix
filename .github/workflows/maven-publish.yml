# This workflow will build a package using Maven and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path

name: Maven Package

on: [...]
  release:
    types: [created]

jobs:
  build:

    runs-on: ubuntu-latest
    If your intent is to make both the apex and www versions redirect to ui.com, the usual setup is:

Primary custom domain: ui.com
Redirecting alias: www.ui.com → ui.com via DNS/CNAME or a small redirect service
In GitHub Pages, keep only the site’s primary custom domain configured, then handle the second hostname with a redirect
If you want, I can help you implement the redirect setup for:

ui.com as the canonical domain, and
www.ui.com redirecting to it.