name: Label new issues for triage

# Issue templates add the 'triage' label, but issues created via the API (e.g. by AI agents) bypass them.
# Labels passed on creation are also silently dropped for users without write access,
# so such issues arrive unlabeled. Mark every issue opened without labels for triage.
on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label:
    if: ${{ join(github.event.issue.labels.*.name) == '' }}
    runs-on: ubuntu-latest
    steps:
      - run: gh issue edit "$NUMBER" --repo "$REPO" --add-label triage
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
