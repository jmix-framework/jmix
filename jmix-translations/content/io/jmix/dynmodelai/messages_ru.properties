io.jmix.dynmodelai.agent.planning/emptyModelResponse=Провайдер модели вернул пустой ответ. По этому запросу изменения не внесены. Попросите администратора проверить ограничения ответа и рассуждений модели.
io.jmix.dynmodelai.agent.planning/modelAccessDenied=Провайдер модели отказал в доступе. Попросите администратора проверить API-ключ и права доступа к модели, прежде чем повторять запрос. По этому запросу изменения не внесены.
io.jmix.dynmodelai.agent.planning/toolCorrectionExhausted=Модель запрашивала недоступные инструменты, и лимит исправлений исчерпан. Повторите запрос.
