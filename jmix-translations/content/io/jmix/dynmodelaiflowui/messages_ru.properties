io.jmix.dynmodelaiflowui.view.builder/dynamicModelBuilderView.emptyText = **Опишите** нужное изменение или **задайте вопрос** о модели приложения.
io.jmix.dynmodelaiflowui.view.builder/dynamicModelBuilderView.emptyExample1 = Что здесь можно сделать?
io.jmix.dynmodelaiflowui.view.builder/dynamicModelBuilderView.emptyExample1Prompt = Расскажи, что можно делать в редакторе динамической модели, чем может помочь ИИ-помощник и какие шаги требуют моего подтверждения. Не изменяй модель.
io.jmix.dynmodelaiflowui.view.builder/dynamicModelBuilderView.emptyExample2 = Обзор текущей модели
io.jmix.dynmodelaiflowui.view.builder/dynamicModelBuilderView.emptyExample2Prompt = Опиши текущую модель приложения: сущности, основные атрибуты, связи и доступные экраны. Не изменяй модель.
io.jmix.dynmodelaiflowui.view.builder/dynamicModelBuilderView.emptyExample3 = Создать сущность
io.jmix.dynmodelaiflowui.view.builder/dynamicModelBuilderView.emptyExample3Prompt = Создай сущность Book с обязательным атрибутом title (текст) и атрибутом price (десятичное число). Используй title как имя экземпляра и создай экраны списка и редактирования.
io.jmix.dynmodelaiflowui.view.builder/dynamicModelBuilderView.emptyExample4 = Добавить атрибут
io.jmix.dynmodelaiflowui.view.builder/dynamicModelBuilderView.emptyExample4Prompt = Помоги добавить необязательный текстовый атрибут phone в существующую сущность. Перед подготовкой изменений спроси, какую сущность нужно изменить.

