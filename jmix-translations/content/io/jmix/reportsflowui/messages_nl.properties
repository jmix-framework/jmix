io.jmix.reportsflowui.view.parameter/parameters.lookupJoinHelp.header=Join-clausule
io.jmix.reportsflowui.view.parameter/parameters.lookupJoinHelp.text=<div>De waarde van dit veld wordt toegevoegd aan de "from"-clausule van de query. Het moet beginnen met een komma, "join" of "left join".\
  <br/>De {E}-placeholder moet worden gebruikt als alias van de entiteit die wordt opgehaald. Bij uitvoering van de query wordt deze vervangen door een echte alias, opgegeven in de query.\
  <br/>\
  <br/>Bijvoorbeeld:\
  <br/><code>join {E}.seller s</code>\
  </div>
