io.jmix.reportsflowui.view.report/bandsTab.dataSetTypeLayout.llmUnguardedOptionalParametersInReport=Opgeslagen query's vergelijken optionele rapportparameters zonder ze af te vangen: %s. Een uitvoering bindt een lege optionele parameter als null, en een gewone vergelijking vindt dan niets, zodat zo'n band zonder foutmelding leeg blijft. Schrijf die voorwaarden als (:name is null or ...)
